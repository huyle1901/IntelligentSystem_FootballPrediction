[project]
name = "ai-football-prediction-system"
version = "0.1.0"
description = "Web-based football match prediction system with FastAPI, React, and ML pipelines."
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.116.0",
    "uvicorn[standard]==0.35.0",
    "requests>=2.32",
    "python-dotenv>=1.1",
    "psycopg[binary]>=3.2",
    "pandas>=2.0.3,<2.3",
    "numpy>=1.24.4,<2.0",
    "scipy>=1.10.1",
    "scikit-learn>=1.3.2,<1.8",
    "xgboost>=2.1.4,<3.0",
    "mrmr-selection>=0.2.8",
    "invoke>=2.2",
]

[tool.uv]
package = false
